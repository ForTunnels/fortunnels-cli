run:
  timeout: 3m
  modules-download-mode: readonly

# The client is published as open source, so on top of the defect set it keeps
# the readability checks people reading the code rely on: formatting, import
# grouping, line length, naming and comment style, spelling and simplifications.
linters-settings:
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/fortunnels)
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/fortunnels
  govet:
    enable-all: true
    disable:
      - fieldalignment
  dupl:
    threshold: 50
  funlen:
    lines: 120
    statements: 120
  gocyclo:
    min-complexity: 35
  lll:
    line-length: 200
  misspell:
    locale: US
  testifylint:
    # encoded-compare turns exact byte comparisons into whitespace-insensitive
    # JSONEq; wire formats and cipher round-trips need the exact form.
    disable:
      - encoded-compare
  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true
  errcheck:
    check-type-assertions: true
    check-blank: true
  depguard:
    rules:
      client:
        files:
          - $all
        allow:
          - $gostd
          - github.com/fortunnels/client
          - github.com/gorilla/websocket
          - github.com/pion/dtls/v3
          - github.com/quic-go/quic-go
          - github.com/stretchr/testify
          - github.com/xtaci/smux
          - go.uber.org/goleak
          - golang.org/x/crypto
          - golang.org/x/term
          - gopkg.in/yaml.v3

# "deadcode" is not a valid golangci-lint linter anymore (inactivated; use "unused" below).
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - funlen
    - gci
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - goprintffuncname
    - gosimple
    - govet
    - lll
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - recvcheck
    - revive
    - staticcheck
    - stylecheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - usetesting
    - whitespace

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
        - dupl
        - errcheck
        - bodyclose
        - goconst
        - revive
        - gocritic
        - contextcheck
        - errchkjson
    - path: internal/config/flags\.go
      linters:
        - dupl
    - text: "exported.*should have comment"
      linters:
        - revive
    - text: "could not import sync/atomic"
      linters:
        - typecheck
  max-issues-per-linter: 0
  max-same-issues: 0
  # The default keeps one issue per line, so a second finding there surfaces a fix cycle later.
  uniq-by-line: false
